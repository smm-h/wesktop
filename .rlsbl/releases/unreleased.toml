# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "patch"
# Short description of this release (required)
description = "Ships an sdist that contains only the package, its tests, its docs and its root metadata."
# Optional context explaining why these changes were made
context = """
The source distribution had no file selection, so hatchling's default shipped
the entire repository. Every sdist from 0.8.1 through 0.11.0 therefore carried
`todo/`, `.rlsbl/`, `.claude/`, `.selfdoc/`, CI workflows and lockfiles to PyPI
-- including twenty screenshots of a private application's interface that were
never meant to leave the machine. The screenshots are deleted, and the sdist
now uses an allowlist rather than the implicit everything-minus-VCS-ignores
default, so a newly added repository directory cannot ship by accident.

Wheels were never affected; they have always been built from `src/wesktop`.
"""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["pypi", "npm"]
exclude = []
