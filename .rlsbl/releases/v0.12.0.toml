# strictspec document version gate (do not remove)
format_version = 1
# Version bump type: patch, minor, major, infra, or prerelease
#   prerelease: advance an existing pre-release (0.6.0-beta.0 -> -beta.1)
bump = "minor"
# Short description of this release (required)
description = "Native window control for frameless apps: WindowChrome, compositor-driven drag, input regions, window capture, headless runs, and windows that follow the desktop light/dark theme."
# Optional context explaining why these changes were made
context = """The first consumer of these features is a frameless terminal emulator app built on wesktop. It needs the app to draw its own window frame, move and capture the window without a screen grab, follow the desktop theme, and run its server with no window under test; that is what this release adds."""
# Pre-release channel: alpha, beta, rc, or stable (ordered;
# demotion is an error). With patch/minor/major it ENTERS the
# channel (0.5.2 + minor + alpha -> 0.6.0-alpha.0); with
# bump = "prerelease" it promotes, and "stable" strips the
# suffix. See docs/release-workflow.md#the-pre-release-channel.
# preid = ""
# Set to true to generate a blog post for this release
# blog = false
include = ["pypi", "npm"]
exclude = []
candidate_sha = "45e58e9d9fb2da89868ceacc139f4fd52055de97"

[tree_hashes]
"." = "c8a20b7f34c9bb6b9b5f0b49b7b764b45031ea80"
