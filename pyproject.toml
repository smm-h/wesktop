[project]
name = "wesktop"
version = "0.11.0"
description = "A Python framework for building web-based desktop applications"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "smm-h", email = "smmh72@gmail.com"}]
keywords = ["desktop", "web", "gui", "pywebview", "granian", "asgi", "rlsbl"]
dependencies = [
    "fastware[all]",
    "pywebview>=6.2.1",
    # 0.36.0 made effect classification mandatory; wesktop's CLI declares
    # `effect="read_only"` on `diagnose` and will not register on anything older.
    "strictcli>=0.36.0",
    "pydantic",
]

[project.scripts]
wesktop = "wesktop.cli:main"

[dependency-groups]
# Installing stricttest IS adoption of the test-isolation floor; the stance is
# declared in [tool.pytest.ini_options] below.
dev = ["pytest", "httpx>=0.28", "stricttest>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wesktop"]

# Allowlist, not a denylist: an sdist ships exactly what is named here. A
# denylist silently ships every new repository directory, which is how 20
# screenshots of a private application's UI reached PyPI in 0.8.1-0.11.0.
# Repository housekeeping (todo/, .rlsbl/, .claude/, .selfdoc/, .strictcli/,
# .github/, lockfiles, CLAUDE.md) is deliberately absent.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The stricttest floor's stance. No implicit defaults exist: a missing key
# aborts the session at configure time.
stricttest_sockets = "deny"
stricttest_socket_allowlist = []
stricttest_unix_socket_allowlist = []
# `allow`, not `allowlist`. Several suites (test_mcp_tools, test_desktop) stand
# up a real threaded HTTPServer on 127.0.0.1 with port 0 and dial it back over
# HTTP. The kernel picks the port, so the pair the guard would have to match is
# unknown until after the bind -- an exact host:port allowlist cannot express
# it. Off-machine traffic stays denied by `stricttest_sockets = "deny"`.
stricttest_loopback = "allow"
# No sandbox runner in this repo yet; the bwrap runner ships as an rlsbl
# scaffold template. Flip to "true" at adoption.
stricttest_sandbox_required = "false"
